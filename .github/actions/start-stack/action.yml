name: Start Stack
description: >
  Download the deterministic core E2E harness distribution, provision Java and
  Node, start the harness launcher (H2, process sandbox transport) with
  synthetic operator/peer credentials, run the explicit CoreE2eSetup
  (preview-first retirement, built-ins, harness Qoder credential), and serve the
  dashboard (dist preview, dev server, or backend only). The smoke and E2E lanes
  run against this harness; the production backend-jar stays the production
  artifact but is not booted here.
inputs:
  frontend-mode:
    description: "'dist' (vite preview of built dist), 'dev' (vite dev server), or 'none' (backend only)"
    required: false
    default: dist
runs:
  using: composite
  steps:
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Setup Node 20
      # Needed even for frontend-mode: none: the harness launches the committed
      # mock peers (and the Qoder ACP bridge) with node.
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Download the deterministic core E2E harness distribution
      uses: actions/download-artifact@v4
      with:
        name: backend-e2e-harness
        path: backend-e2e-harness/
    - name: Download frontend dist
      if: ${{ inputs.frontend-mode == 'dist' }}
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: agent-control-tower/act-dashboard/dist/
    - name: Extract the harness distribution
      shell: bash
      run: |
        set -euo pipefail
        cd backend-e2e-harness
        unzip -q act-app-*-backend-e2e-harness.zip -d extracted
        test -f extracted/app/io/aria/conductor/ActApplication.class
        test -f extracted/harness/io/aria/conductor/app/e2e/CoreE2eApplication.class
        test -f extracted/bridge/main.js
        test -f extracted/scenarios.json
    - name: Generate the synthetic harness credentials
      # Never repository secrets: the operator bearer token and the peer control
      # token are generated per run and exported for the launcher and the specs.
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "ARIA_OPERATOR_BEARER_TOKEN=ci-operator-$(openssl rand -hex 16)"
          echo "ARIA_PEER_CONTROL_TOKEN=ci-peer-$(openssl rand -hex 16)"
          echo "ARIA_E2E_QODER_CREDENTIAL=ci-qoder-$(openssl rand -hex 16)"
        } >> "$GITHUB_ENV"
    - name: Start the deterministic core E2E harness (H2, process transport)
      shell: bash
      run: |
        set -euo pipefail
        HARNESS="$GITHUB_WORKSPACE/backend-e2e-harness/extracted"
        java --enable-preview -cp "$HARNESS/app:$HARNESS/harness:$HARNESS/lib/*" \
          io.aria.conductor.app.e2e.CoreE2eApplication \
          --e2e.assets="$HARNESS" \
          --e2e.work-root="$GITHUB_WORKSPACE/backend-e2e-harness/work" \
          --e2e.sandbox-transport=process > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
        timeout 180 bash -c 'until curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; do sleep 2; done'
    - name: Run the explicit harness setup (built-ins, Qoder credential)
      shell: bash
      run: |
        set -euo pipefail
        HARNESS="$GITHUB_WORKSPACE/backend-e2e-harness/extracted"
        java --enable-preview -cp "$HARNESS/app:$HARNESS/harness:$HARNESS/lib/*" \
          io.aria.conductor.app.e2e.CoreE2eSetup \
          --base-url=http://127.0.0.1:8080
    - name: Install frontend deps and serve dist
      if: ${{ inputs.frontend-mode == 'dist' }}
      shell: bash
      run: |
        cd agent-control-tower/act-dashboard
        pnpm install --frozen-lockfile
        pnpm exec vite preview --port 5173 &
        timeout 60 bash -c 'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 2; done'
    - name: Install frontend deps and start dev server
      if: ${{ inputs.frontend-mode == 'dev' }}
      shell: bash
      run: |
        cd agent-control-tower/act-dashboard
        pnpm install --frozen-lockfile
        pnpm dev &
        timeout 60 bash -c 'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 2; done'
