name: CI

on:
  pull_request:
    branches: [main]

jobs:
  java-tests:
    name: Java Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup LangChain ADK venv
        run: cd langchain-adk && python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - name: Run tests with JaCoCo coverage
        run: cd agent-control-tower && mvn clean test -Dmaven.repo.local=/tmp/m2-fresh -Dspring.profiles.active=h2
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: agent-control-tower/**/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: agent-control-tower/act-dashboard/pnpm-lock.yaml
      - name: Install and build
        run: cd agent-control-tower/act-dashboard && pnpm install --frozen-lockfile && pnpm build

  e2e-smoke:
    name: E2E Smoke Test (Backend Endpoints)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build all modules
        run: cd agent-control-tower && mvn install -DskipTests -Dmaven.repo.local=/tmp/m2-fresh
      - name: Start backend (H2 + mock ADK)
        run: |
          cd agent-control-tower
          mvn spring-boot:run -pl act-app -Dspring-boot.run.profiles=h2 -Dmaven.repo.local=/tmp/m2-fresh &
          timeout 120 bash -c 'until curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; do sleep 2; done'
      - name: Smoke test endpoints
        run: |
          echo "Testing /actuator/health..."
          curl -sf http://localhost:8080/actuator/health
          echo ""
          echo "Testing /api/v1/agents..."
          curl -sf http://localhost:8080/api/v1/agents
          echo ""
          echo "Testing /api/v1/dashboard/summary..."
          curl -sf http://localhost:8080/api/v1/dashboard/summary
          echo ""
          echo "Testing /api/v1/workflows..."
          curl -sf http://localhost:8080/api/v1/workflows
          echo ""
          echo "Testing /api/v1/knowledge?type=WORKFLOW..."
          curl -sf "http://localhost:8080/api/v1/knowledge?type=WORKFLOW"
          echo ""
          echo "All smoke tests passed."

  python-tests:
    name: Python Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: cd langchain-adk && pip install -e ".[dev]"
      - name: Run tests with coverage
        run: cd langchain-adk && pytest --cov=src --cov-report=xml --cov-fail-under=0 || [ $? -eq 5 ]
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: langchain-adk/coverage.xml
          fail_ci_if_error: false

  ts-tests:
    name: TS MCP Server Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: packages/mcp-server/pnpm-lock.yaml
      - name: Run tests with coverage
        run: cd packages/mcp-server && pnpm install --frozen-lockfile && pnpm test -- --coverage
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: packages/mcp-server/coverage/clover.xml
          fail_ci_if_error: false

  e2e-workflow-governance:
    name: E2E Workflow Governance (Playwright)
    runs-on: ubuntu-latest
    needs: [java-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: agent-control-tower/act-dashboard/pnpm-lock.yaml
      - name: Build backend
        run: cd agent-control-tower && mvn install -DskipTests -Dmaven.repo.local=/tmp/m2-fresh
      - name: Start backend (H2)
        run: |
          cd agent-control-tower
          mvn spring-boot:run -pl act-app -Dspring-boot.run.profiles=h2 -Dmaven.repo.local=/tmp/m2-fresh &
          timeout 120 bash -c 'until curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; do sleep 2; done'
      - name: Install and start frontend dev server
        run: |
          cd agent-control-tower/act-dashboard
          pnpm install --frozen-lockfile
          pnpm dev &
          timeout 60 bash -c 'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 2; done'
      - name: Install Playwright browsers
        run: cd agent-control-tower/act-dashboard && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: cd agent-control-tower/act-dashboard && CI=true npx playwright test e2e/workflow-governance.spec.ts e2e/agent-tool-skill-recommendations.spec.ts --workers=1
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: agent-control-tower/act-dashboard/test-results/




  e2e-agent-dev-workflow:
    name: E2E Agent Dev-Workflow Governance (Playwright)
    runs-on: ubuntu-latest
    needs: [java-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: agent-control-tower/act-dashboard/pnpm-lock.yaml
      - name: Build backend
        run: cd agent-control-tower && mvn install -DskipTests -Dmaven.repo.local=/tmp/m2-fresh
      - name: Start backend (H2)
        run: |
          cd agent-control-tower
          mvn spring-boot:run -pl act-app -Dspring-boot.run.profiles=h2 -Dmaven.repo.local=/tmp/m2-fresh &
          timeout 120 bash -c 'until curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; do sleep 2; done'
      - name: Install and start frontend dev server
        run: |
          cd agent-control-tower/act-dashboard
          pnpm install --frozen-lockfile
          pnpm dev &
          timeout 60 bash -c 'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 2; done'
      - name: Install Playwright browsers
        run: cd agent-control-tower/act-dashboard && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: cd agent-control-tower/act-dashboard && CI=true npx playwright test e2e/agent-dev-workflow-governance.spec.ts e2e/harness-governance.spec.ts --workers=1
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-agent-dev-workflow-results
          path: agent-control-tower/act-dashboard/test-results/


  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [java-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t aria-backend ./agent-control-tower
      - name: Build frontend image
        run: docker build -t aria-frontend ./agent-control-tower/act-dashboard
      - name: Build ADK image
        run: docker build -t aria-adk ./langchain-adk
