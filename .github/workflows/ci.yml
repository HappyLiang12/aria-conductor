name: CI

on:
  pull_request:
    branches: [main]

# Stacked pushes to the same PR cancel the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Trees
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      mcp: ${{ steps.filter.outputs.mcp }}
      frontend: ${{ steps.filter.outputs.frontend }}
      java: ${{ steps.filter.outputs.java }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'langchain-adk/**'
            mcp:
              - 'packages/mcp-server/**'
            frontend:
              - 'agent-control-tower/act-dashboard/**'
            java:
              - 'agent-control-tower/**'
              - '!agent-control-tower/act-dashboard/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  build:
    name: Build Backend (once)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [changes]
    # E2E consumes the jar even for frontend-only changes; skip only for docs/python/mcp-only PRs.
    if: needs.changes.outputs.java == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build all modules (skip tests)
        run: cd agent-control-tower && mvn -q -T 1C install -DskipTests
      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: agent-control-tower/act-app/target/act-app-*.jar
          retention-days: 1

  java-unit-tests:
    name: Java Unit Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.java == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: common-agent
            modules: act-common,act-agent,act-test-support
          - group: execution
            modules: act-execution
          - group: knowledge-aria
            modules: act-knowledge,act-aria
          - group: dashboard-app
            modules: act-dashboard-api,act-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        if: matrix.group == 'execution'
        with:
          python-version: '3.11'
      - name: Setup LangChain ADK venv (only act-execution's ADK provider tests spawn it)
        if: matrix.group == 'execution'
        run: cd langchain-adk && python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - name: Install reactor (skip tests)
        # Deliberate: rebuilding from source with the setup-java Maven cache is cheap and
        # simpler than piping a ~200MB repo artifact between jobs (plan PR-2 decision).
        run: cd agent-control-tower && mvn -q -T 1C install -DskipTests
      - name: Run unit tier with JaCoCo
        run: cd agent-control-tower && mvn test -pl ${{ matrix.modules }} -Dspring.profiles.active=h2 -Dskip.integration.tests=true
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: agent-control-tower/**/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  java-integration-tests:
    name: Java Integration Tests (Failsafe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.java == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup LangChain ADK venv
        run: cd langchain-adk && python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - name: Install reactor (skip tests)
        run: cd agent-control-tower && mvn -q -T 1C install -DskipTests
      - name: Run integration tier only
        run: cd agent-control-tower && mvn verify -Dskip.unit.tests=true -Dspring.profiles.active=h2

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: agent-control-tower/act-dashboard/pnpm-lock.yaml
      - name: Install dependencies
        run: cd agent-control-tower/act-dashboard && pnpm install --frozen-lockfile
      - name: Run unit tests (vitest)
        run: cd agent-control-tower/act-dashboard && pnpm test
      - name: Build
        run: cd agent-control-tower/act-dashboard && pnpm build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: agent-control-tower/act-dashboard/dist/
          retention-days: 1

  e2e-smoke:
    name: E2E Smoke Test (Backend Endpoints)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Start stack (backend only)
        uses: ./.github/actions/start-stack
        with:
          frontend-mode: none
      - name: Smoke test endpoints
        run: |
          echo "Testing /actuator/health..."
          curl -sf http://localhost:8080/actuator/health
          echo ""
          echo "Testing /api/v1/agents..."
          curl -sf http://localhost:8080/api/v1/agents
          echo ""
          echo "Testing /api/v1/dashboard/summary..."
          curl -sf http://localhost:8080/api/v1/dashboard/summary
          echo ""
          echo "Testing /api/v1/workflows..."
          curl -sf http://localhost:8080/api/v1/workflows
          echo ""
          echo "Testing /api/v1/knowledge?type=WORKFLOW..."
          curl -sf "http://localhost:8080/api/v1/knowledge?type=WORKFLOW"
          echo ""
          echo "All smoke tests passed."

  python-tests:
    name: Python Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: cd langchain-adk && pip install -e ".[dev]"
      - name: Run tests with coverage
        run: cd langchain-adk && pytest --cov=src --cov-report=xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: langchain-adk/coverage.xml
          fail_ci_if_error: false

  ts-tests:
    name: TS MCP Server Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.mcp == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: packages/mcp-server/pnpm-lock.yaml
      - name: Run tests with coverage
        run: cd packages/mcp-server && pnpm install --frozen-lockfile && pnpm test -- --coverage
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: packages/mcp-server/coverage/clover.xml
          fail_ci_if_error: false

  e2e-playwright:
    name: E2E Playwright (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build, frontend-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: agent-control-tower/act-dashboard/pnpm-lock.yaml
      - name: Start stack (dist preview)
        uses: ./.github/actions/start-stack
        with:
          frontend-mode: dist
      - name: Install Playwright browsers
        run: cd agent-control-tower/act-dashboard && npx playwright install --with-deps chromium
      - name: Run E2E shard
        run: cd agent-control-tower/act-dashboard && CI=true npx playwright test --shard=${{ matrix.shard }}/4 --workers=1
      - name: Dump backend log tail (diagnose backend death)
        if: failure()
        run: tail -n 300 backend.log || true; ls hs_err_pid*.log 2>/dev/null && cat hs_err_pid*.log || true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            agent-control-tower/act-dashboard/test-results/
            backend.log
            hs_err_pid*.log

  # ---------------------------------------------------------------------------
  # BURN-IN: legacy Playwright jobs kept in parallel with the sharded matrix for
  # one week of green runs, then remove (plan Phase A3). Do not extend these.
  # ---------------------------------------------------------------------------
  e2e-workflow-governance:
    name: E2E Workflow Governance (Playwright, legacy burn-in)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: agent-control-tower/act-dashboard/pnpm-lock.yaml
      - name: Start stack (dev server)
        uses: ./.github/actions/start-stack
        with:
          frontend-mode: dev
      - name: Install Playwright browsers
        run: cd agent-control-tower/act-dashboard && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: cd agent-control-tower/act-dashboard && CI=true npx playwright test e2e/workflow-governance.spec.ts e2e/agent-tool-skill-recommendations.spec.ts --workers=1
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: agent-control-tower/act-dashboard/test-results/

  e2e-agent-dev-workflow:
    name: E2E Agent Dev-Workflow Governance (Playwright, legacy burn-in)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: agent-control-tower/act-dashboard/pnpm-lock.yaml
      - name: Start stack (dev server)
        uses: ./.github/actions/start-stack
        with:
          frontend-mode: dev
      - name: Install Playwright browsers
        run: cd agent-control-tower/act-dashboard && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: cd agent-control-tower/act-dashboard && CI=true npx playwright test e2e/agent-dev-workflow-governance.spec.ts e2e/harness-governance.spec.ts --workers=1
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-agent-dev-workflow-results
          path: agent-control-tower/act-dashboard/test-results/

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t aria-backend ./agent-control-tower
      - name: Build frontend image
        run: docker build -t aria-frontend ./agent-control-tower/act-dashboard
      - name: Build ADK image
        run: docker build -t aria-adk ./langchain-adk
