name: CI

# Rewired around the deterministic core E2E harness (Task 19):
#   * the `build` job builds the Qoder ACP bridge (its dist/ is git-ignored), then
#     the whole reactor with `-Pcore-e2e-harness`, runs the mandatory packaging IT
#     in the profile lane (tests enabled; the default Failsafe lane excludes it),
#     and uploads BOTH artifacts: the production `backend-jar` and the
#     `backend-e2e-harness` distribution;
#   * the smoke and Playwright lanes boot the harness distribution through
#     `.github/actions/start-stack` (process sandbox transport, synthetic operator
#     and peer credentials, explicit CoreE2eSetup) - never the production jar;
#   * no PR lane needs a live-LLM key or a Qoder PAT: the harness supplies the
#     deterministic LLM client. Live tiers stay in the nightly workflow.
# The real OpenSandbox lane lives in its own requirement-triggered workflow
# (sandbox-lifecycle.yml) and is never substituted by this process-transport job.

on:
  pull_request:
    branches: [main]
  # Explicit branch validation: run this workflow on any branch on demand.
  workflow_dispatch: {}

# Stacked pushes to the same PR cancel the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Trees
    runs-on: ubuntu-latest
    outputs:
      mcp: ${{ steps.filter.outputs.mcp }}
      frontend: ${{ steps.filter.outputs.frontend }}
      java: ${{ steps.filter.outputs.java }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mcp:
              - 'packages/mcp-server/**'
            frontend:
              - 'agent-control-tower/act-dashboard/**'
            java:
              - 'agent-control-tower/**'
              - '!agent-control-tower/act-dashboard/**'
              - 'packages/qoder-acp-bridge/**'
              - 'e2e/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  build:
    name: Build Backend + Harness Distribution (once)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    # E2E consumes the harness distribution even for frontend-only changes; skip only
    # for docs/mcp-only PRs.
    if: needs.changes.outputs.java == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: packages/qoder-acp-bridge/pnpm-lock.yaml
      - name: Build the Qoder ACP bridge (git-ignored dist/)
        # The harness packaging profile rebuilds dist/ itself (antrun + tsc); the
        # node_modules install is the CI-side prerequisite for that build.
        run: cd packages/qoder-acp-bridge && pnpm install --frozen-lockfile && pnpm build
      - name: Build all modules and the harness distribution (skip tests)
        run: mvn -q -T 1C -f agent-control-tower/pom.xml -Pcore-e2e-harness install -DskipTests
      - name: Run the harness packaging IT (profile lane, tests enabled)
        # The default Failsafe lane EXCLUDES CoreE2ePackagingIntegrationTest; this
        # profile lane clears that exclusion and is mandatory, so the shipped ZIP
        # and the production jar boundary are always checked as they ship.
        run: >
          mvn -f agent-control-tower/pom.xml -Pcore-e2e-harness -pl act-app verify
          -Dskip.unit.tests=true -Dit.test=CoreE2ePackagingIntegrationTest
      - name: Upload production backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: agent-control-tower/act-app/target/act-app-*.jar
          retention-days: 1
      - name: Upload deterministic core E2E harness distribution
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-harness
          path: agent-control-tower/act-app/target/act-app-*-backend-e2e-harness.zip
          retention-days: 1

  java-unit-tests:
    name: Java Unit Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.java == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: common-agent
            modules: act-common,act-agent,act-test-support
          - group: execution
            modules: act-execution
          - group: knowledge-aria
            modules: act-knowledge,act-aria
          - group: api-mcp-app
            modules: act-dashboard-api,act-mcp,act-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install reactor (skip tests)
        # Deliberate: rebuilding from source with the setup-java Maven cache is cheap and
        # simpler than piping a ~200MB repo artifact between jobs (plan PR-2 decision).
        # The reactor install must precede every module lane: a stale installed jar once
        # made Mockito fail on "could not modify all classes" for a new type.
        run: cd agent-control-tower && mvn -q -T 1C install -DskipTests
      - name: Run unit tier with JaCoCo
        run: cd agent-control-tower && mvn test -pl ${{ matrix.modules }} -Dspring.profiles.active=h2 -Dskip.integration.tests=true
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: agent-control-tower/**/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  java-integration-tests:
    name: Java Integration Tests (Failsafe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.java == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: packages/qoder-acp-bridge/pnpm-lock.yaml
      - name: Build the Qoder ACP bridge (git-ignored dist/)
        # The core adapter contract ITs launch the real bridge against the mock peer
        # CLI: the entry is a committed path whose dist/ is git-ignored, so the lane
        # that runs them must build it (the harness `build` job does the same).
        run: cd packages/qoder-acp-bridge && pnpm install --frozen-lockfile && pnpm build
      - name: Install reactor (skip tests)
        run: cd agent-control-tower && mvn -q -T 1C install -DskipTests
      - name: Run integration tier only
        run: cd agent-control-tower && mvn verify -Dskip.unit.tests=true -Dspring.profiles.active=h2
      # SchemaConsistencySmokeTest runs in the unit tier (surefire includes *SmokeTest);
      # no dedicated step needed - the V40 columns are pinned there with full coverage.

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: agent-control-tower/act-dashboard/pnpm-lock.yaml
      - name: Install dependencies
        run: cd agent-control-tower/act-dashboard && pnpm install --frozen-lockfile
      - name: Run unit tests (vitest, coverage thresholds enforced)
        run: cd agent-control-tower/act-dashboard && pnpm test -- --coverage
      - name: Build
        run: cd agent-control-tower/act-dashboard && pnpm build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: agent-control-tower/act-dashboard/dist/
          retention-days: 1

  e2e-smoke:
    name: E2E Smoke Test (deterministic harness)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Start the deterministic harness (backend only)
        uses: ./.github/actions/start-stack
        with:
          frontend-mode: none
      - name: Smoke test endpoints
        run: |
          echo "Testing /actuator/health..."
          curl -sf http://localhost:8080/actuator/health
          echo ""
          echo "Testing /api/v1/agents..."
          curl -sf http://localhost:8080/api/v1/agents
          echo ""
          echo "Testing /api/v1/dashboard/summary..."
          curl -sf http://localhost:8080/api/v1/dashboard/summary
          echo ""
          echo "Testing /api/v1/workflows..."
          curl -sf http://localhost:8080/api/v1/workflows
          echo ""
          echo "Testing /api/v1/knowledge?type=WORKFLOW..."
          curl -sf "http://localhost:8080/api/v1/knowledge?type=WORKFLOW"
          echo ""
          echo "All smoke tests passed."
      - name: Dump backend log tail (diagnose)
        if: failure()
        run: tail -n 300 backend.log || true

  ts-tests:
    name: TS MCP Server Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.mcp == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: packages/mcp-server/pnpm-lock.yaml
      - name: Run tests with coverage
        run: cd packages/mcp-server && pnpm install --frozen-lockfile && pnpm test -- --coverage
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: packages/mcp-server/coverage/clover.xml
          fail_ci_if_error: false

  e2e-playwright:
    name: E2E Playwright (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, frontend-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: agent-control-tower/act-dashboard/pnpm-lock.yaml
      - name: Start the deterministic harness (dist preview)
        uses: ./.github/actions/start-stack
        with:
          frontend-mode: dist
      - name: Install Playwright browsers
        run: cd agent-control-tower/act-dashboard && npx playwright install --with-deps chromium
      - name: Run E2E shard
        run: CI=true pnpm --dir "$GITHUB_WORKSPACE/agent-control-tower/act-dashboard" exec playwright test --shard=${{ matrix.shard }}/4 --workers=1
      - name: Dump backend log tail (diagnose backend death)
        if: failure()
        run: tail -n 300 backend.log || true; ls hs_err_pid*.log 2>/dev/null && cat hs_err_pid*.log || true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            agent-control-tower/act-dashboard/test-results/
            backend.log
            hs_err_pid*.log

  # ---------------------------------------------------------------------------
  # BURN-IN complete (one week of green runs since 2026-07-25): the legacy
  # e2e-workflow-governance / e2e-agent-dev-workflow jobs are removed — their
  # specs are covered by the sharded matrix (plan Phase A3).
  # The real OpenSandbox lane is NOT here: it runs in sandbox-lifecycle.yml and
  # its results are reported separately (never substituted by this job).
  # ---------------------------------------------------------------------------

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t aria-backend ./agent-control-tower
      - name: Verify backend image ships the agent CLIs (git/curl/gh) - #65
        run: |
          docker run --rm --entrypoint /bin/sh aria-backend -c '
            set -e
            git --version
            curl --version | head -1
            gh --version
          '
      - name: Build frontend image
        run: docker build -t aria-frontend ./agent-control-tower/act-dashboard
