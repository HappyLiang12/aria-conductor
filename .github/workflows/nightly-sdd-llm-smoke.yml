name: Nightly SDD LLM Smoke

# Live-LLM canary for the governed SDD path (Task 19 retarget): a real BA run must
# produce a spec through a live provider and pause the chain at WAITING_APPROVAL.
#
# Retargeted from the removed LangChain runtime to the OpenCode core (the default
# and recommended core), placed in HOST mode so the runner needs no container
# runtime. The live tier is gated on BOTH:
#   * an explicit workflow_dispatch with `live: true` (a scheduled run alone never
#     spends live tokens on a provider), and
#   * the DEEPSEEK_API_KEY repository secret.
# When either is missing every live step is guarded off and the run states so: it
# never reports a pass for work it did not do. This lane is NOT part of the PR
# pipeline — no required PR job needs a live-LLM key.

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC nightly
  workflow_dispatch:
    inputs:
      live:
        description: 'Run the live-LLM tier (requires the DEEPSEEK_API_KEY secret)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nightly-sdd-llm-smoke:
    name: Real-LLM SDD Loop Smoke (opencode, HOST)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SDD_REPO_URL: https://github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether the live tier runs
        id: live
        env:
          LIVE_REQUESTED: ${{ inputs.live }}
        run: |
          set -euo pipefail
          if [ -n "${DEEPSEEK_API_KEY}" ] && [ "${LIVE_REQUESTED}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Live tier enabled: explicit dispatch input and the credential secret are both present."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "NOT VERIFIED: the live tier needs workflow_dispatch with live=true AND the DEEPSEEK_API_KEY secret."
          fi

      - name: Generate the synthetic operator credential
        if: steps.live.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          echo "ARIA_OPERATOR_BEARER_TOKEN=nightly-operator-$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: steps.live.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        if: steps.live.outputs.enabled == 'true'
        with:
          node-version: '20'

      - name: Install the OpenCode core CLI (same pin as the sandbox image)
        if: steps.live.outputs.enabled == 'true'
        run: npm install -g opencode-ai@1.18.15 && opencode --version

      - name: Build backend (skip tests)
        if: steps.live.outputs.enabled == 'true'
        run: cd agent-control-tower && mvn -q -T 1C install -DskipTests

      - name: Start backend (H2 + OpenCode core, live provider)
        if: steps.live.outputs.enabled == 'true'
        env:
          # The model-provider variables the OpenCode core child resolves
          # (application.yml `opencode.sandbox-env`) plus the provider settings.
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com/v1
          LLM_MODEL: deepseek-chat
          LLM_PROVIDER_BASE_URL: https://api.deepseek.com/v1
          LLM_PROVIDER_MODEL: deepseek-chat
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd agent-control-tower
          java --enable-preview -jar act-app/target/act-app-*.jar \
            --spring.profiles.active=h2 \
            --aria.cores.opencode.executable=opencode > ../backend.log 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; do sleep 2; done'

      - name: Prepare the SDD role agents (built-ins, OpenCode, HOST placement)
        # The runner has no container runtime, so the seeded SDD role agents are
        # pinned to the HOST-capable OpenCode selection through the production
        # agent route before the chain is instantiated. The workflow template
        # resolves its steps by agent role (ba/dev/qa).
        if: steps.live.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          API=http://localhost:8080
          AUTH="Authorization: Bearer ${ARIA_OPERATOR_BEARER_TOKEN}"
          curl -sf -X POST -H "$AUTH" "$API/api/v1/maintenance/initialize-builtins"
          for role in ba dev qa; do
            AGENT_ID=$(curl -sf "$API/api/v1/agents" | jq -r --arg role "$role" '.[] | select(.role == $role) | .id' | head -1)
            test -n "$AGENT_ID" && test "$AGENT_ID" != "null"
            echo "pinning $role agent $AGENT_ID to opencode/HOST"
            curl -sf -X PUT -H "$AUTH" -H 'Content-Type: application/json' \
              -d '{"adkProvider":"opencode","executionMode":"HOST"}' \
              "$API/api/v1/agents/$AGENT_ID" > /dev/null
          done

      - name: Run SDD loop until WAITING_APPROVAL
        if: steps.live.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          API=http://localhost:8080

          # Resolve the seeded development-workflow template (V40 seed).
          TPL_ID=$(curl -sf "$API/api/v1/knowledge?type=WORKFLOW&status=APPROVED" \
            | jq -r '.[] | select(.name == "development-workflow") | .id')
          test -n "$TPL_ID" && test "$TPL_ID" != "null"
          echo "template id: $TPL_ID"

          # Instantiate the template -> starts the BA run with a real LLM.
          CHAIN_ID=$(curl -sf -X POST "$API/api/v1/knowledge/$TPL_ID/instantiate-workflow" \
            -H 'Content-Type: application/json' \
            -d '{"parameters":{"issueRef":"#1-nightly-smoke","repoUrl":"'"$SDD_REPO_URL"'"}}' | jq -r '.id')
          test -n "$CHAIN_ID" && test "$CHAIN_ID" != "null"
          echo "chain id: $CHAIN_ID"

          # Poll for the spec-approval gate. A real BA run must produce a spec and pause.
          for _ in $(seq 1 180); do
            STATUS=$(curl -sf "$API/api/v1/workflows/$CHAIN_ID" | jq -r '.status')
            echo "chain status: $STATUS"
            if [ "$STATUS" = "WAITING_APPROVAL" ]; then
              echo "PASS: SDD loop reached WAITING_APPROVAL with a real LLM on the OpenCode core."
              exit 0
            fi
            case "$STATUS" in
              FAILED|CANCELLED|COMPLETED)
                echo "FAIL: SDD loop ended unexpectedly in $STATUS."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "FAIL: timed out waiting for WAITING_APPROVAL."
          exit 1

      - name: Cleanup residual RUNNING runs (best-effort)
        # No dedicated "fail run" maintenance endpoint exists; cancel each RUNNING run via
        # the cancel endpoint. The H2 file DB is runner-scoped and discarded with the
        # ephemeral runner, so residual state does not persist either way.
        if: always() && steps.live.outputs.enabled == 'true'
        run: |
          set -uo pipefail
          for id in $(curl -sf http://localhost:8080/api/v1/runs?status=RUNNING | jq -r '.[].id' 2>/dev/null); do
            echo "cancelling residual RUNNING run $id"
            curl -sf -X POST "http://localhost:8080/api/v1/runs/$id/cancel" > /dev/null || true
          done
          true

      - name: Dump backend log tail (diagnose)
        if: failure()
        run: tail -n 300 backend.log || true
