name: Sandbox Lifecycle (real OpenSandbox)

# The real-container boundary lane (Task 19). It boots a REAL OpenSandbox server
# from docker-compose.yml, builds the committed mock-peer test image
# (agent-control-tower/runtime-sandbox/test.Dockerfile) and drives the
# PRODUCTION Java sandbox backend against it through
# e2e/agent-core/sandbox-lifecycle.test.mjs:
#
#   * endpoint authentication of the run-owned sandbox;
#   * upload (the snapshot/manifest drive the launch);
#   * verified pause (SIGSTOP of the writer tree) and resume;
#   * automatic TTL renewal that really calls the server and stops for teardown;
#   * background writer termination; stable export BEFORE kill; one sandbox's
#     destroy never touching another's.
#
# Requirement-triggered (the sandbox backends, the workspace transfer, the bridge
# and sandbox images, the startup/compose paths) and reportable separately from
# the PR workflow: its result is NEVER substituted by the process-transport
# Playwright job in ci.yml, and this job never substitutes it.
#
# The lane fails closed: every missing prerequisite (server, runtime, image,
# toolchain) fails the lane with the exact missing item, so a skipped run can
# never read as a pass.

on:
  pull_request:
    branches: [main]
    paths:
      - 'agent-control-tower/act-execution/src/main/java/io/aria/conductor/execution/runtime/sandbox/**'
      - 'agent-control-tower/act-execution/src/main/java/io/aria/conductor/execution/runtime/host/**'
      - 'agent-control-tower/act-execution/src/main/java/io/aria/conductor/execution/runtime/RunWorkspaceService.java'
      - 'agent-control-tower/act-execution/src/main/java/io/aria/conductor/execution/runtime/WorkspaceService.java'
      - 'agent-control-tower/act-execution/src/main/java/io/aria/conductor/execution/runtime/WorkspaceLease.java'
      - 'agent-control-tower/act-execution/src/main/java/io/aria/conductor/execution/runtime/CoreExecutionService.java'
      - 'agent-control-tower/act-execution/src/test/java/io/aria/conductor/execution/runtime/sandbox/**'
      - 'agent-control-tower/runtime-sandbox/**'
      - 'agent-control-tower/opencode-sandbox/**'
      - 'agent-control-tower/qoder-sandbox/**'
      - 'agent-control-tower/act-app/src/test/resources/e2e/**'
      - 'packages/qoder-acp-bridge/**'
      - 'opensandbox-config.toml'
      - 'docker-compose.yml'
      - 'e2e/agent-core/sandbox-lifecycle.test.mjs'
      - 'scripts/start-backend.sh'
      - 'scripts/start-backend.ps1'
      - 'scripts/lib/**'
      - '.github/workflows/sandbox-lifecycle.yml'
  workflow_dispatch: {}

concurrency:
  group: sandbox-lifecycle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sandbox-lifecycle:
    name: Sandbox Lifecycle (mock-peer image, real OpenSandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start the real OpenSandbox server
        # The server creates/kills sandbox containers through the mounted docker
        # socket; SANDBOX_SOCKET defaults to /var/run/docker.sock.
        run: docker compose up -d --wait opensandbox-server
      - name: Wait for the OpenSandbox server health
        run: |
          set -euo pipefail
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:8090/health > /dev/null 2>&1; do sleep 2; done'
          curl -sf http://127.0.0.1:8090/health
      - name: Build the mock-peer sandbox test image
        run: docker build -t aria-conductor/runtime-sandbox-test:1.0 -f agent-control-tower/runtime-sandbox/test.Dockerfile .
      - name: Run the real sandbox lifecycle lane
        env:
          OPEN_SANDBOX_URL: http://127.0.0.1:8090
          SANDBOX_RUNTIME: docker
          SANDBOX_TEST_IMAGE: aria-conductor/runtime-sandbox-test:1.0
        run: node --test e2e/agent-core/sandbox-lifecycle.test.mjs
      - name: Dump the OpenSandbox server logs (diagnose)
        if: failure()
        run: docker compose logs --tail 300 opensandbox-server || true
      - name: Stop the OpenSandbox server
        if: always()
        run: docker compose down || true
