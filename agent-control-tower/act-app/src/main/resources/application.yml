spring:
  application:
    name: aria-conductor
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

knowledge:
  storage:
    base-path: ./data/knowledge
  git:
    base-path: ./data/knowledge-repos
  mirror:
    path: ./data/knowledge-mirror
    stale-threshold-seconds: 120

tools:
  file:
    project-root: ${PROJECT_ROOT:.}
    workspace-dir: ${TOOLS_FILE_WORKSPACE_DIR:./data/workspaces}
  shell:
    enabled: ${TOOLS_SHELL_ENABLED:false}
    whitelist: ${TOOLS_SHELL_WHITELIST:git,ls,cat,find,echo,mvn,npm,pnpm}
