spring:
  application:
    name: aria-conductor
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        name: aria-conductor
        enabled: ${aria.mcp.enabled:true}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

knowledge:
  storage:
    base-path: ./data/knowledge
  git:
    base-path: ./data/knowledge-repos
  mirror:
    path: ./data/knowledge-mirror
    stale-threshold-seconds: 120

tools:
  file:
    workspace-dir: ${TOOLS_FILE_WORKSPACE_DIR:./data/workspaces}

opencode:
  sandbox-server-url: http://127.0.0.1:8090
  sandbox-api-key: ${OPENSANDBOX_API_KEY:}
  # Total window (ms) one run-owned workspace upload may spend absorbing transient
  # execd connectivity failures (Windows/WSL published-port relay warm-up observed
  # to exceed the former ~18s budget). The run still fails loudly after the window.
  sandbox-upload-window-ms: ${OPENCODE_SANDBOX_UPLOAD_WINDOW_MS:90000}
  image: aria-conductor/opencode-sandbox:1.1
  port: 4096
  # Default repo URL for SDD templates that declare {repoUrl} but the caller omits it (R8-F1).
  repo-url: ${SDD_REPO_URL:}
  # Env vars injected into every agent sandbox (e.g. LLM model credentials for opencode)
  sandbox-env:
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:}
    LLM_API_KEY: ${LLM_API_KEY:${DEEPSEEK_API_KEY:}}
    GH_TOKEN: ${GITHUB_TOKEN:${GH_TOKEN:}}

# Backend-embedded MCP endpoint (spec: docs/superpowers/specs/2026-09-05-mcp-into-opencode-design.md)
aria:
  # Mode-neutral run deadline of a coordinated execution attempt
  # (TaskDeadlineProperties). New runs freeze the operator value at admission;
  # the operator value lives in System Config (aria.tasks.deadline-minutes,
  # seeded by V73) and this property is the fallback when no row exists.
  tasks:
    deadline-minutes: 45
  # Concurrent run execution (run admission queue): the rest wait PENDING with
  # their kanban cards in TODO. 0 disables a limit. Workers never consume the
  # Aria reservation (default 6 + 3); Aria runs serialize per conversation, so a
  # parked turn blocks only its own conversation.
  runs:
    max-active: ${ARIA_RUNS_MAX_ACTIVE:6}
    aria-reserved: ${ARIA_RUNS_ARIA_RESERVED:3}
    # How often the deferred-stop worker re-drives a verified core stop that was refused
    # after its Kanban card move already committed (DeferredRunStop.retryPendingStops).
    # The run carries RUN_STOP_PENDING until the stop verifies or the run ends by itself.
    stop-retry-delay-ms: ${ARIA_RUNS_STOP_RETRY_DELAY_MS:30000}
  # HOST placement only (HostFileAccessProperties). GATED (default) keeps a
  # HOST core's workspace tools read-only in the launch profile but surfaces its
  # native write asks to the operator; READ_ONLY auto-denies those asks;
  # FULL lets the core edit, write and run shell commands as the backend user
  # and auto-approves. A HOST run is not bounded by a run-owned container, so
  # FULL is a full-filesystem grant with no sandbox and no undo. SANDBOX runs
  # are unchanged.
  host:
    files: ${ARIA_HOST_FILES:GATED}
  mcp:
    enabled: ${ARIA_MCP_ENABLED:true}
    auth-mode: ${ARIA_MCP_AUTH_MODE:none}
    debug: ${ARIA_MCP_DEBUG:false}
    token: ${ARIA_MCP_TOKEN:}
    sandbox-host-address: ${ARIA_MCP_SANDBOX_HOST_ADDRESS:}
    port: ${ARIA_MCP_PORT:8080}
  progress:
    retention-days: ${ARIA_PROGRESS_RETENTION_DAYS:7}
    cleanup-cron: ${ARIA_PROGRESS_CLEANUP_CRON:0 30 3 * * *}
  # The phone's live loop (spec docs/superpowers/specs/2026-11-23-aria-qwen-live-bridge-design.md
  # §Deployment). Off by default: the endpoint answers, but no bridge child is spawned until a
  # deployment turns it on. `bridge-script` is repo-relative (resolved from the backend's
  # working directory and its parents), `credentials-file` is the 0600 env file the child reads
  # its provider key from; neither value is logged. `realtime-url` empty means the child derives
  # the SG WSS endpoint from the workspace region, and it is not a secret.
  live:
    enabled: ${ARIA_LIVE_ENABLED:false}
    bridge-script: ${ARIA_LIVE_BRIDGE_SCRIPT:}
    credentials-file: ${ARIA_LIVE_CREDENTIALS_FILE:}
    ready-deadline-ms: ${ARIA_LIVE_READY_DEADLINE_MS:5000}
    max-session-seconds: ${ARIA_LIVE_MAX_SESSION_SECONDS:7200}
    realtime-url: ${ARIA_LIVE_REALTIME_URL:}
    # DeepSeek direct locator (spec D6): the backup that draws a box when the live turn's
    # own `highlight_target` render was missed. Off by default — no direct provider call is
    # made until a deployment turns it on. The key is never a property here: it is read from
    # DEEPSEEK_API_KEY in the Aria environment (aria.live.direct.api-key is an optional
    # override for a harness) and is never logged; LLM_API_KEY is deliberately not read, and
    # a deployment without DEEPSEEK_API_KEY leaves the locator disabled. direct-timeout-ms is
    # the whole call's budget, and direct-base-url gets /chat/completions appended.
    direct-locator-enabled: ${ARIA_LIVE_DIRECT_LOCATOR_ENABLED:false}
    direct-base-url: ${ARIA_LIVE_DIRECT_BASE_URL:}
    direct-model: ${ARIA_LIVE_DIRECT_MODEL:}
    direct-timeout-ms: ${ARIA_LIVE_DIRECT_TIMEOUT_MS:1500}
  # Verified qmd read paths
  # (spec: docs/superpowers/specs/2026-11-24-memory-knowledge-hub-design.md). Both
  # blocks are opt-in: with `enabled: false` the contributors keep the pre-qmd
  # behaviour and never open a connection, so a CI box needs no running qmd. When
  # enabled, an unreachable qmd degrades the section within `timeout-ms` instead of
  # stalling the turn. `collections` is a comma-separated allow-list the client
  # enforces on every hit, together with the request's sensitivity ceiling.
  # `project` is the single-project vault scope that stands in for a real path: a
  # run's workspaceRef is `MODE@baseRef` (for example `HOST@main`), not a filesystem
  # path, so the project scope derived from it is null and `aria.memory.qmd.project` /
  # `aria.knowledge.qmd.project` supplies the vault project instead.
  memory:
    qmd:
      enabled: ${ARIA_MEMORY_QMD_ENABLED:false}
      url: ${ARIA_MEMORY_QMD_URL:http://127.0.0.1:8181}
      collections: ${ARIA_MEMORY_QMD_COLLECTIONS:memory-verified}
      project: ${ARIA_MEMORY_QMD_PROJECT:}
      vault-dir: ${ARIA_MEMORY_QMD_VAULT_DIR:}
      timeout-ms: ${ARIA_MEMORY_QMD_TIMEOUT_MS:1500}
      max-results: ${ARIA_MEMORY_QMD_MAX_RESULTS:4}
      min-score: ${ARIA_MEMORY_QMD_MIN_SCORE:0.15}
  knowledge:
    qmd:
      enabled: ${ARIA_KNOWLEDGE_QMD_ENABLED:false}
      url: ${ARIA_KNOWLEDGE_QMD_URL:http://127.0.0.1:8181}
      collections: ${ARIA_KNOWLEDGE_QMD_COLLECTIONS:knowledge-verified}
      project: ${ARIA_KNOWLEDGE_QMD_PROJECT:}
      vault-dir: ${ARIA_KNOWLEDGE_QMD_VAULT_DIR:}
      timeout-ms: ${ARIA_KNOWLEDGE_QMD_TIMEOUT_MS:1500}
      max-results: ${ARIA_KNOWLEDGE_QMD_MAX_RESULTS:4}
      min-score: ${ARIA_KNOWLEDGE_QMD_MIN_SCORE:0.15}
  # Per-core launch configuration. The Qoder bridge refuses a `--cli` that is not
  # an absolute existing executable and must be told files that exist, so a
  # configured value is resolved at launch and an unresolvable one refuses the
  # run loudly by key name. The opencode keys (`aria.cores.opencode.executable`,
  # `aria.cores.opencode.model`, `aria.cores.opencode.version`) keep their Java
  # defaults.
  cores:
    # Extra tool directories appended to the host PATH a HOST core's shell resolves
    # tools through (comma-separated; either the native `C:\...` or the MSYS
    # `/c/...` spelling). The run launcher clears the process environment, so a
    # tool that is only on the operator's ambient PATH (GitHub CLI, a non-standard
    # JDK/Maven, jq) is absent in the core without this value. The host PATH itself
    # is always passed through; this list is for what is not on it.
    toolchain-path: ${ARIA_CORES_TOOLCHAIN_PATH:}
    qoder:
      # Reviewed model pin of a qoder run. `efficient` is the operator-set default
      # (the pinned model of the Qoder acceptance); a paid model must be set here
      # explicitly by the operator.
      model: ${ARIA_CORES_QODER_MODEL:efficient}
      # Absolute path of the pinned Qoder CLI. A bare name is resolved against PATH
      # at launch; the CLI of this machine is
      # C:\Users\User\.qoder\bin\qodercli\qodercli.exe.
      executable: ${ARIA_CORES_QODER_EXECUTABLE:qoder}
      # Absolute path of the built committed bridge entry
      # (packages/qoder-acp-bridge/dist/main.js; run `pnpm build` there).
      bridge-entry: ${ARIA_CORES_QODER_BRIDGE_ENTRY:packages/qoder-acp-bridge/dist/main.js}
  # Run-owned roots. The start scripts export absolute values derived from the
  # repository root, so a run's worktree, generated configuration and retained
  # results never depend on the backend process working directory; a relative
  # configured value is anchored at that working directory.
  workspaces:
    runtime-root: ${ARIA_WORKSPACES_RUNTIME_ROOT:./data/workspaces/runs}
    result-root: ${ARIA_WORKSPACES_RESULT_ROOT:./data/workspaces/results}
