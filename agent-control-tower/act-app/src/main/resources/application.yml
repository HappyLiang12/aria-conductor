spring:
  application:
    name: aria-conductor
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

knowledge:
  storage:
    base-path: ./data/knowledge
  git:
    base-path: ./data/knowledge-repos
  mirror:
    path: ./data/knowledge-mirror
    stale-threshold-seconds: 120
