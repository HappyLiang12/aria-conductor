spring:
  application:
    name: aria-conductor
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        name: aria-conductor
        enabled: ${aria.mcp.enabled:true}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

knowledge:
  storage:
    base-path: ./data/knowledge
  git:
    base-path: ./data/knowledge-repos
  mirror:
    path: ./data/knowledge-mirror
    stale-threshold-seconds: 120

tools:
  file:
    project-root: ${PROJECT_ROOT:.}
    workspace-dir: ${TOOLS_FILE_WORKSPACE_DIR:./data/workspaces}
  shell:
    enabled: ${TOOLS_SHELL_ENABLED:false}
    whitelist: ${TOOLS_SHELL_WHITELIST:git,ls,cat,find,echo,mvn,npm,pnpm,curl}

opencode:
  sandbox-server-url: http://localhost:8090
  sandbox-api-key: ${OPENSANDBOX_API_KEY:}
  image: aria-conductor/opencode-sandbox:1.1
  port: 4096
  max-task-minutes: 45
  # Default repo URL for SDD templates that declare {repoUrl} but the caller omits it (R8-F1).
  repo-url: ${SDD_REPO_URL:}
  # Env vars injected into every agent sandbox (e.g. LLM model credentials for opencode)
  sandbox-env:
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:}
    LLM_API_KEY: ${LLM_API_KEY:${DEEPSEEK_API_KEY:}}
    GH_TOKEN: ${GH_TOKEN:}

# Backend-embedded MCP endpoint (spec: docs/superpowers/specs/2026-09-05-mcp-into-opencode-design.md)
aria:
  mcp:
    enabled: ${ARIA_MCP_ENABLED:true}
    auth-mode: ${ARIA_MCP_AUTH_MODE:none}
    debug: ${ARIA_MCP_DEBUG:false}
    token: ${ARIA_MCP_TOKEN:}
    sandbox-host-address: ${ARIA_MCP_SANDBOX_HOST_ADDRESS:}
    port: ${ARIA_MCP_PORT:8080}
