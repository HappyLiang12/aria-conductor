name: aria-conductor

services:
  mariadb:
    image: mariadb:11.4
    container_name: aria-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${DB_NAME:-aria_conductor}
      MYSQL_USER: ${DB_USER:-aria}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aria-network

  backend:
    build:
      context: ./agent-control-tower
      dockerfile: Dockerfile
    container_name: aria-backend
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-aria_conductor}
      DB_USER: ${DB_USER:-aria}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      LLM_PROVIDER_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_PROVIDER_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      # Injected into opencode sandboxes via application.yml opencode.sandbox-env
      # (opencode needs LLM credentials inside the sandbox to call models).
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${LLM_API_KEY:-}}
      ADK_HOST: langchain-adk
      ADK_PORT: 9300
      PROJECT_ROOT: /project
      TOOLS_SHELL_WHITELIST: ${TOOLS_SHELL_WHITELIST:-git,ls,cat,find,echo,mvn,npm,pnpm,curl}
      TOOLS_FILE_WORKSPACE_DIR: /workspaces
      TOOLS_SHELL_ENABLED: ${TOOLS_SHELL_ENABLED:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PACK_CREDENTIAL_KEY: ${PACK_CREDENTIAL_KEY:-}
      # OpenSandbox server API key (optional; insecure server mode in this compose file).
      # Env var name MUST carry the `opencode` prefix to bind opencode.sandbox-api-key.
      OPENCODE_SANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-}
      # Overrides opencode.sandbox-server-url in Docker network (Spring relaxed binding);
      # default http://localhost:8080 in application.yml is for local dev outside Docker.
      # NOTE: env var name MUST carry the `opencode` prefix (OPENCODE_SANDBOX_SERVER_URL);
      # OPENSANDBOX_SERVER_URL does not bind to opencode.sandbox-server-url (prefix mismatch).
      OPENCODE_SANDBOX_SERVER_URL: http://opensandbox-server:8080
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - knowledge_data:/app/data
      - ${PROJECT_SOURCE:-.}:/project:ro
      - aria_workspaces:/workspaces
    networks:
      - aria-network

  opensandbox-server:
    image: opensandbox/server:latest
    container_name: aria-opensandbox
    # The opencode sandbox image (used by the opencode provider at runtime) must be
    # built before the first run:
    #   docker build -t aria-conductor/opencode-sandbox:1.1 agent-control-tower/opencode-sandbox
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      # Required for non-interactive container startup when no server API key is configured;
      # for production, set [server] api_key in the config below and remove this variable
      OPENSANDBOX_INSECURE_SERVER: "YES"
    ports:
      # Container port 8080; host 8090 avoids clash with aria-backend's 8080 binding
      - "127.0.0.1:${OPENSANDBOX_PORT:-8090}:8080"
    volumes:
      # Container-runtime socket used to create/kill sandbox containers. Defaults to
      # Docker; set SANDBOX_SOCKET for podman (rootless: /run/user/1000/podman/podman.sock,
      # rootful: /run/podman/podman.sock).
      - ${SANDBOX_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # Persist server-managed metadata (SQLite store at ~/.opensandbox/opensandbox.db)
      - opensandbox_data:/root/.opensandbox
    configs:
      - source: opensandbox-config
        target: /etc/opensandbox/config.toml
    networks:
      - aria-network

  langchain-adk:
    build:
      context: ./langchain-adk
      dockerfile: Dockerfile
    container_name: aria-adk
    environment:
      HOST: "0.0.0.0"
      PORT: "9300"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_DEFAULT_MODEL: ${LLM_MODEL:-gpt-4o}
    ports:
      - "127.0.0.1:${ADK_PORT:-9300}:9300"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9300/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - aria-network

  frontend:
    build:
      context: ./agent-control-tower/act-dashboard
      dockerfile: Dockerfile
    container_name: aria-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - aria-network

configs:
  # OpenSandbox server config (Docker runtime mode), generated per official
  # server/docker-compose.example.yaml; equivalent to `uvx opensandbox-server init-config --example docker`
  opensandbox-config:
    content: |
      [server]
      host = "0.0.0.0"
      port = 8080
      # eip overrides the public host part of returned sandbox endpoint URLs.
      # Required for the local-dev topology (backend on the host): without it the
      # server returns the sandbox container's bridge IP, unreachable from the host.
      # Supported by the official opensandbox/server image (v0.2.2+) - works with
      # both Docker and podman (no image patch needed).
      eip = "127.0.0.1"

      [log]
      level = "INFO"

      [runtime]
      type = "docker"
      execd_image = "opensandbox/execd:v1.0.21"

      [docker]
      network_mode = "bridge"
      # host_ip=127.0.0.1 is only valid when the backend runs ON the Docker host
      # (local-dev topology): sandbox endpoints (execd port mappings) must resolve
      # from the backend process, and on the host loopback they do. `host.docker.internal`
      # does NOT resolve from host processes on Windows (only from inside containers).
      # FULL-STACK COMPOSE TOPOLOGY: the backend is a container, so 127.0.0.1 inside it
      # points at the backend container itself — sandbox endpoints are unreachable and the
      # opencode provider is NOT usable in full-stack compose mode (runs fail with
      # SANDBOX_UNAVAILABLE after the SDK timeout). Use the local-dev topology (backend on
      # the Docker host) or the langchain provider for the full-stack compose deployment.
      host_ip = "127.0.0.1"
      port_range_min = 40000
      port_range_max = 60000

      [ingress]
      mode = "direct"

volumes:
  mariadb_data:
  knowledge_data:
  aria_workspaces:
  opensandbox_data:

networks:
  aria-network:
    driver: bridge
