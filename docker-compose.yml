name: aria-conductor

services:
  mariadb:
    image: mariadb:11.4
    container_name: aria-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${DB_NAME:-aria_conductor}
      MYSQL_USER: ${DB_USER:-aria}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aria-network

  backend:
    build:
      context: ./agent-control-tower
      dockerfile: Dockerfile
    container_name: aria-backend
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-aria_conductor}
      DB_USER: ${DB_USER:-aria}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      LLM_PROVIDER_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_PROVIDER_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      # Injected into opencode sandboxes via application.yml opencode.sandbox-env
      # (opencode needs LLM credentials inside the sandbox to call models).
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${LLM_API_KEY:-}}
      PROJECT_ROOT: /project
      TOOLS_SHELL_WHITELIST: ${TOOLS_SHELL_WHITELIST:-git,ls,cat,find,echo,mvn,npm,pnpm,curl}
      TOOLS_FILE_WORKSPACE_DIR: /workspaces
      TOOLS_SHELL_ENABLED: ${TOOLS_SHELL_ENABLED:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PACK_CREDENTIAL_KEY: ${PACK_CREDENTIAL_KEY:-}
      # OpenSandbox server API key (optional; insecure server mode in this compose file).
      # Env var name MUST carry the `opencode` prefix to bind opencode.sandbox-api-key.
      OPENCODE_SANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-}
      # Overrides opencode.sandbox-server-url in Docker network (Spring relaxed binding);
      # default http://localhost:8080 in application.yml is for local dev outside Docker.
      # NOTE: env var name MUST carry the `opencode` prefix (OPENCODE_SANDBOX_SERVER_URL);
      # OPENSANDBOX_SERVER_URL does not bind to opencode.sandbox-server-url (prefix mismatch).
      OPENCODE_SANDBOX_SERVER_URL: http://opensandbox-server:8080
      # "localhost" resolves to the IPv6 loopback ([::1]) on some hosts while the
      # JDK client dials the first resolved address; the sandbox execd endpoints
      # are IPv4-only, so pin the stack to IPv4 to avoid intermittent connect
      # failures on direct execd URLs.
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      # Operator authority (2026-10-05 simplification): a request from loopback is
      # the local operator with no token, and ARIA_OPERATOR_BEARER_TOKEN (when set)
      # authenticates non-loopback callers as the operator. The containerized
      # frontend nginx proxies /api to this backend, so the backend's direct peer
      # is the frontend container -- not the operator's browser -- and loopback
      # auto-authority does not apply to those forwarded requests. Trusting the
      # proxy needs an exact peer address in ARIA_OPERATOR_TRUSTED_PROXIES, but
      # Docker assigns the frontend container a dynamic IP (a compose service name
      # never appears in getRemoteAddr(), and the resolver deliberately supports no
      # CIDR), so the compose stack cannot enable it by default -- the variable
      # stays empty here and proxied deployments must pin the frontend's static IP
      # and list it explicitly. See README "Configuration / Environment Variables".
      ARIA_OPERATOR_TRUSTED_PROXIES: ${ARIA_OPERATOR_TRUSTED_PROXIES:-}
      # Remote/compose deployments: a request presenting this bearer credential is
      # the operator (loopback needs no token).
      ARIA_OPERATOR_BEARER_TOKEN: ${ARIA_OPERATOR_BEARER_TOKEN:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - knowledge_data:/app/data
      - ${PROJECT_SOURCE:-.}:/project:ro
      - aria_workspaces:/workspaces
    networks:
      - aria-network

  opensandbox-server:
    image: opensandbox/server:latest
    container_name: aria-opensandbox
    # The opencode sandbox image (used by the opencode provider at runtime) must be
    # built before the first run; the context is the repository root because the image
    # consumes the shared runtime-sandbox launcher/control scripts:
    #   docker build -t aria-conductor/opencode-sandbox:1.1 \
    #     -f agent-control-tower/opencode-sandbox/Dockerfile .
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      # Required for non-interactive container startup when no server API key is configured;
      # for production, set [server] api_key in the config below and remove this variable
      OPENSANDBOX_INSECURE_SERVER: "YES"
    ports:
      # Container port 8080; host 8090 avoids clash with aria-backend's 8080 binding
      - "127.0.0.1:${OPENSANDBOX_PORT:-8090}:8080"
    volumes:
      # Container-runtime socket used to create/kill sandbox containers. Defaults to
      # Docker; set SANDBOX_SOCKET for podman (rootless: /run/user/1000/podman/podman.sock,
      # rootful: /run/podman/podman.sock). Under podman machine the source path is
      # resolved inside the Linux VM, so it must be a VM-internal path (not an SSH URL).
      - ${SANDBOX_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # Server config mounted as a volume (NOT compose `configs:` — podman-compose
      # 1.0.6+ does not support the configs: block and the server would fall back
      # to Kubernetes mode and crash without its config).
      - ./opensandbox-config.toml:/etc/opensandbox/config.toml:ro
      # Persist server-managed metadata (SQLite store at ~/.opensandbox/opensandbox.db)
      - opensandbox_data:/root/.opensandbox
    networks:
      - aria-network

  frontend:
    build:
      context: ./agent-control-tower/act-dashboard
      dockerfile: Dockerfile
    container_name: aria-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - aria-network

volumes:
  mariadb_data:
  knowledge_data:
  aria_workspaces:
  opensandbox_data:

networks:
  aria-network:
    driver: bridge
